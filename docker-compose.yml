services:
  postgres:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    container_name: knoggin-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=knoggin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-knoggin}
      - POSTGRES_DB=knoggin_db
    volumes:
      - knoggin_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/src/infrastructure/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knoggin -d knoggin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  knoggin_pg_data:
