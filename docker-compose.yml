services:
  redis:
    image: redis:8-alpine
    container_name: knoggin-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - knoggin_redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  postgres:
    build:
      context: docker/postgres
      dockerfile: Dockerfile
    container_name: knoggin-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=knoggin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-knoggin}
      - POSTGRES_DB=knoggin_db
    volumes:
      - knoggin_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./knoggin-server/src/infrastructure/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knoggin -d knoggin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  knoggin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knoggin-api
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config
    env_file: .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=${DATABASE_URL:-postgresql://knoggin:knoggin@postgres:5432/knoggin_db}
      - CONFIG_DIR=/app/config
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  knoggin_pg_data:
  knoggin_redis_data:
