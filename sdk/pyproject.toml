[project]
name = "knoggin-sdk"
version = "0.1.0"
description = "Python SDK for an installed Knoggin engine"
requires-python = ">=3.12"
dependencies = ["server"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["knoggin*"]

[tool.uv.sources]
server = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../server/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure or mostly pure fast tests",
    "no_network: test is expected to make no external network calls",
]
