# Typed-boundary baseline captured on 2026-09-18.
#
# Scope deliberately covers durable semantic-window contracts, ingestion
# policy and admission inputs, and the WorkRecord snapshot model while the
# wider refactor is still being typed. The baseline is six current files with
# zero mypy errors. New code in this scope must keep the result at zero;
# broadening the scope is separate, reviewable work.
[mypy]
python_version = 3.12
mypy_path = src
files =
    src/common/schema/ingestion/contracts.py,
    src/common/schema/semantic_window.py,
    src/core/ingestion/batch.py,
    src/core/ingestion/policy.py,
    src/core/ingestion/semantic_window_admission.py,
    src/infrastructure/work_record.py
follow_imports = skip
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true
